<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 900), H = +(q.get('h') || 700);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = +(q.get('exp') || 0.95);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.035).texture;
scene.environmentIntensity = +(q.get('env') || 0.75);

const gltf = await new GLTFLoader().loadAsync('./model.glb');
const root = gltf.scene;
const hide = (q.get('hide') || '').split(',').filter(Boolean);
root.traverse(o => { if (hide.includes(o.name)) o.visible = false; if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(root);

// frame the model
const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
root.position.sub(center);
const radius = size.length() / 2;
root.updateMatrixWorld(true);
const byName = n => root.getObjectByName(n);
const lid = byName('nJoEOlgGwcdXBHJ'), body = byName('iqLXttIronNPiXb');
const bodyBox = new THREE.Box3().setFromObject(body);
// Hinge: along X at the top-back edge of the body (back = -Z, away from the default camera).
// Hinge: the model's own hinge part. Its centre is the pivot, the pin runs along X.
const hingePart = byName('rXHaxBciRFTeNPF');
const hinge = new THREE.Box3().setFromObject(hingePart).getCenter(new THREE.Vector3());
// hinge is in world space; the pivot lives inside the (re-centred) root, so convert.
const pivot = new THREE.Object3D(); pivot.position.copy(root.worldToLocal(hinge.clone())); root.add(pivot); pivot.updateMatrixWorld(true);
pivot.attach(lid);
const lidBoxAt = deg => { pivot.rotation.x = deg * Math.PI / 180; pivot.updateMatrixWorld(true); return new THREE.Box3().setFromObject(lid); };
// Closed = the FLATTEST lid position (smallest height) that sits on top of the body's footprint.
// (The lid's rim wraps slightly down over the body when shut, so "never below the top" is wrong.)
const bodyC = bodyBox.getCenter(new THREE.Vector3()), bodyDepth = bodyBox.max.z - bodyBox.min.z;
let closedDeg = 0, best = Infinity;
for (let d = -180; d <= 180; d += 0.5) {
  const b = lidBoxAt(d), c = b.getCenter(new THREE.Vector3());
  const onTop = c.y > bodyBox.max.y - size.y * 0.05 && Math.abs(c.z - bodyC.z) < bodyDepth * 0.25;
  const score = (b.max.y - b.min.y) + (onTop ? 0 : 1);
  if (score < best) { best = score; closedDeg = d; }
}
const table = [];
for (let d = -180; d <= 180; d += 15) { const b = lidBoxAt(d); table.push([d, ...b.min.toArray(), ...b.max.toArray()].map(v => +(+v).toFixed(4))); }
window.__table = table;
// lidT: 0 = closed, 1 = as modelled (open). Or 'lid' = explicit degrees.
const lidT = q.get('lidT');
pivot.rotation.x = (lidT !== null ? closedDeg * (1 - +lidT) : +(q.get('lid') || 0)) * Math.PI / 180;
pivot.updateMatrixWorld(true);
window.__hinge = { closedDeg, hinge: hinge.toArray().map(v => +v.toFixed(4)), body: [bodyBox.min.toArray(), bodyBox.max.toArray()].map(a => a.map(v => +v.toFixed(4))) };
// Buds: budsT 0 = down in the case's slots (hidden), 1 = floating as modelled.
// Start over the slots (body centre in X/Z), tops at the rim; everything below the rim is clipped,
// so the buds appear to rise out of the case. No clipping at budsT = 1 (frame = hero image).
const budsNode = byName('NwGGgfiOhfXuluV');
const budsBox = new THREE.Box3().setFromObject(budsNode);
const budsC = budsBox.getCenter(new THREE.Vector3()), bodyCtr = bodyBox.getCenter(new THREE.Vector3());
const rimY = bodyBox.max.y;
const seated = new THREE.Vector3(bodyCtr.x - budsC.x, -(budsBox.max.y - rimY), bodyCtr.z - budsC.z);
const mover = new THREE.Object3D(); root.add(mover); mover.updateMatrixWorld(true); mover.attach(budsNode);
const budsT = q.get('budsT') !== null ? +q.get('budsT') : 1;
mover.position.copy(seated).multiplyScalar(1 - budsT);
if (budsT < 1) {
  renderer.localClippingEnabled = true;
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -rimY);
  budsNode.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.clippingPlanes = [plane]; } });
}

const cam = new THREE.PerspectiveCamera(30, W / H, radius / 100, radius * 100);
const az = +(q.get('az') || 35) * Math.PI / 180, el = +(q.get('el') || 22) * Math.PI / 180;
const dist = radius / Math.sin(cam.fov * Math.PI / 360) * 1.05;
cam.position.set(dist * Math.cos(el) * Math.sin(az), dist * Math.sin(el), dist * Math.cos(el) * Math.cos(az));
cam.lookAt(0, 0, 0);

// soft key light + floor shadow
const key = new THREE.DirectionalLight(0xffffff, +(q.get('key') || 0.9));
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.35));
key.position.set(radius * 2, radius * 4, radius * 2); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 12; key.shadow.bias = -0.0005;
const s = radius * 2; Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: radius / 10, far: radius * 12 });
scene.add(key);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(radius * 8, radius * 8), new THREE.ShadowMaterial({ opacity: +(q.get('shadow') || 0.28) }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -size.y / 2 - radius * 0.002; floor.receiveShadow = true;
scene.add(floor);

renderer.render(scene, cam);
window.__info = { table: window.__table, hinge: window.__hinge, size: size.toArray().map(v => +v.toFixed(4)), meshes: (() => { let n = 0; root.traverse(o => o.isMesh && n++); return n; })() };
window.__done = true;
</script></body></html>
