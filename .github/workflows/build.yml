name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Publishing a Release on github.com (which creates its tag) builds the exe and attaches it.
  release:
    types: [published]

permissions:
  contents: write   # needed to attach the exe to a release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/PodBridge.Core.Tests -c Release

      - name: Publish self-contained exe
        run: >
          dotnet publish src/PodBridge.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: PodBridge-win-x64
          path: out/PodBridge.exe

      # Memory experiment: the same exe without single-file compression. Compressed assemblies are
      # unpacked into private memory when loaded; uncompressed ones are mapped from the file.
      # Too big (~190 MB) to commit (GitHub's 100 MB file limit), so it's a build artifact only.
      - name: Publish uncompressed variant
        if: github.event_name == 'push'
        run: >
          dotnet publish src/PodBridge.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out-uncompressed

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: PodBridge-win-x64-uncompressed
          path: out-uncompressed/PodBridge.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "PodBridge $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/PodBridge.exe --clobber
