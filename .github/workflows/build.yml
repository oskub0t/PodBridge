name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Publishing a Release on github.com (which creates its tag) builds the exe and attaches it.
  release:
    types: [published]

permissions:
  contents: write   # needed to attach the exe to a release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/PodBridge.Core.Tests -c Release

      # Not compressed: compressed single-file assemblies are unpacked into private memory (about
      # 100+ MB). The exe is ~160 MB, so releases also carry it zipped (~65 MB) for the updater.
      - name: Publish self-contained exe
        run: >
          dotnet publish src/PodBridge.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path out/PodBridge.exe -DestinationPath out/PodBridge.zip -CompressionLevel Optimal

      # Test builds: Actions → this run → Artifacts → PodBridge-win-x64 (GitHub zips it).
      - uses: actions/upload-artifact@v4
        with:
          name: PodBridge-win-x64
          path: out/PodBridge.exe

      # Both assets: PodBridge 0.4.7 and older update from PodBridge.exe only; newer ones prefer the zip.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "PodBridge $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/PodBridge.exe out/PodBridge.zip --clobber
